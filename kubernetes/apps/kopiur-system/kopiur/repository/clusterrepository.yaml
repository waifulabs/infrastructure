---
# yaml-language-server: $schema=https://kubernetes-schemas.ok8.sh/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: b2
spec:
  allowedNamespaces:
    all: true
  credentialProjection:
    allowed: true
  backend:
    s3:
      bucket: puddle-kopiur
      endpoint: s3.us-west-004.backblazeb2.com
      auth:
        secretRef:
          name: kopiur-repository-secret
          namespace: kopiur-system
  encryption:
    passwordSecretRef:
      name: kopiur-repository-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  parameters:
    epoch:
      # kopia's 24h default let epochs hold ~2600 index blobs at this cluster's
      # write rate; compaction trails two epochs, so the repo carried ~5k
      # uncompacted blobs and `repository connect` took over 4 minutes.
      minDuration: 4h
  scheduleDefaults:
    timezone: America/Los_Angeles
