---
# yaml-language-server: $schema=https://kubernetes-schemas.ok8.sh/gateway.envoyproxy.io/backendtrafficpolicy_v1alpha1.json
# Replaces the gateway-wide policy for this route without compression: Envoy's compressor
# strips Accept-Encoding upstream, and llama-server's web UI refuses clients without gzip.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: llama-cpp
spec:
  connection:
    bufferLimit: 8Mi
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: llama-cpp
  tcpKeepalive: {}
  timeout:
    http:
      requestTimeout: 0s
