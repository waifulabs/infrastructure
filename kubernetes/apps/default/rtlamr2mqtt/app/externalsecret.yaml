---
# yaml-language-server: $schema=https://kubernetes-schemas.ok8.sh/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rtlamr2mqtt
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: rtlamr2mqtt-secret
    creationPolicy: Owner
    template:
      templateFrom:
        - configMap:
            name: rtlamr2mqtt-config-tpl
            items:
              - key: rtlamr2mqtt.yaml
  dataFrom:
    - extract:
        key: rtlamr2mqtt
      rewrite:
        - regexp:
            source: "(.*)"
            target: "rtlamr2mqtt_$1"
    - extract:
        key: mosquitto
      rewrite:
        - regexp:
            source: "(.*)"
            target: "mosquitto_$1"
