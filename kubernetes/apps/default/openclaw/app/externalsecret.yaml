---
# yaml-language-server: $schema=https://kubernetes-schemas.ok8.sh/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openclaw
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: openclaw-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Shared token for the Gateway API and Control UI (required for non-loopback binds).
        OPENCLAW_GATEWAY_TOKEN: "{{ .OPENCLAW_GATEWAY_TOKEN }}"
        # Discord bot token (Message Content intent enabled).
        DISCORD_BOT_TOKEN: "{{ .DISCORD_BOT_TOKEN }}"
        # Model provider: add one of these to the 1Password item and uncomment it here.
        # ANTHROPIC_API_KEY: "{{ .ANTHROPIC_API_KEY }}"
        # OPENAI_API_KEY: "{{ .OPENAI_API_KEY }}"
        # GEMINI_API_KEY: "{{ .GEMINI_API_KEY }}"
        # OPENROUTER_API_KEY: "{{ .OPENROUTER_API_KEY }}"
  dataFrom:
    - extract:
        key: openclaw
