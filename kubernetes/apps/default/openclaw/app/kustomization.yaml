---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./ocirepository.yaml
  - ./backendtrafficpolicy.yaml
  - ./helmrelease.yaml
configMapGenerator:
  # Seed files only: the init container copies these into the PVC when missing.
  # After first boot the PVC copy is the source of truth (onboard, channels add,
  # Control UI edits persist). To reseed, delete the file on the PVC and restart.
  - name: openclaw-seed
    files:
      - openclaw.json=./resources/openclaw.json
      - AGENTS.md=./resources/AGENTS.md
generatorOptions:
  disableNameSuffixHash: true
