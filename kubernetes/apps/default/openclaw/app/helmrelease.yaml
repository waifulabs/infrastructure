---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app openclaw
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: openclaw
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      openclaw:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          automountServiceAccountToken: false
        initContainers:
          # The fsGroup-managed PVC root is group-writable and not owned by UID 1000, so
          # OpenClaw refuses it as a state/temp ancestor. Provision private children owned
          # by the Gateway UID once and mount them via subPath (upstream
          # docs/install/kubernetes.md "Private storage after a PVC remount").
          init-dirs:
            image:
              repository: docker.io/library/busybox
              tag: "1.38"
            command:
              - sh
              - -c
              - |
                set -eu
                for d in state update-captures; do
                  [ -d "/pvc/$d" ] && continue
                  mkdir "/pvc/$d"
                  chmod 0700 "/pvc/$d"
                  chown 1000:1000 "/pvc/$d"
                done
            securityContext:
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"], add: ["CHOWN", "DAC_OVERRIDE"] }
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 32Mi
          # Adapted from upstream scripts/k8s/manifests/deployment.yaml: seed config
          # only when missing, and prepare a sticky /tmp (OpenClaw rejects
          # world-writable temp ancestors without the sticky bit).
          init-config:
            dependsOn: init-dirs
            image:
              repository: docker.io/library/busybox
              tag: "1.38"
            command:
              - sh
              - -c
              - |
                set -eu
                [ -f /home/node/.openclaw/openclaw.json ] || cp /seed/openclaw.json /home/node/.openclaw/openclaw.json
                mkdir -p /home/node/.openclaw/workspace
                [ -f /home/node/.openclaw/workspace/AGENTS.md ] || cp /seed/AGENTS.md /home/node/.openclaw/workspace/AGENTS.md
                mkdir -p /tmp-volume/gateway-tmp && chmod 1777 /tmp-volume/gateway-tmp
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
        containers:
          app:
            image:
              repository: ghcr.io/openclaw/openclaw
              tag: 2026.11.5-slim@sha256:9c74476e3e79b5a1595fd5cf904286eaba3471c10c640aaa9a361a89b41d0882
            command: ["node", "/app/dist/index.js", "gateway", "run"]
            env:
              TZ: America/Los_Angeles
              HOME: /home/node
              OPENCLAW_CONFIG_DIR: /home/node/.openclaw
              OPENCLAW_STATE_DIR: /home/node/.openclaw
              # Private SQLite snapshots need a writable cache on the read-only rootfs.
              XDG_CACHE_HOME: /home/node/.openclaw/.cache
              NODE_ENV: production
            envFrom:
              - secretRef:
                  name: openclaw-secret
            probes:
              # The Control UI answers unknown paths with a catch-all 200, so these
              # assert the JSON body rather than the status code (as upstream does).
              # /startupz ignores channel health, so a broken Discord token won't
              # evict the Gateway from the Service.
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: &startupz
                      - node
                      - -e
                      - "require('http').get('http://127.0.0.1:18789/startupz', r => { let b = ''; r.on('data', d => b += d); r.on('end', () => { try { process.exit(r.statusCode < 400 && JSON.parse(b).ok === true ? 0 : 1); } catch { process.exit(1); } }); }).on('error', () => process.exit(1))"
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: *startupz
                  periodSeconds: 10
                  timeoutSeconds: 5
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - node
                      - -e
                      - "require('http').get('http://127.0.0.1:18789/healthz', r => { let b = ''; r.on('data', d => b += d); r.on('end', () => { try { process.exit(r.statusCode < 400 && JSON.parse(b).ok === true ? 0 : 1); } catch { process.exit(1); } }); }).on('error', () => process.exit(1))"
                  periodSeconds: 30
                  timeoutSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            # The model runs at the provider, so this is just the Node gateway.
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: openclaw
        ports:
          http:
            port: 18789
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            path: /healthz
        hostnames:
          - "{{ .Release.Name }}.ok8.sh"
        parentRefs:
          - name: internal
            namespace: networking
    persistence:
      home:
        existingClaim: openclaw-zfs
        advancedMounts:
          openclaw:
            init-dirs:
              - path: /pvc
            init-config:
              - path: /home/node/.openclaw
                subPath: state
            app:
              - path: /home/node/.openclaw
                subPath: state
              - path: /home/node/.openclaw.update-captures
                subPath: update-captures
      config:
        type: configMap
        name: openclaw-config
        advancedMounts:
          openclaw:
            init-config:
              - path: /seed
                readOnly: true
      tmp:
        type: emptyDir
        advancedMounts:
          openclaw:
            init-config:
              - path: /tmp-volume
            app:
              - path: /tmp
                subPath: gateway-tmp
