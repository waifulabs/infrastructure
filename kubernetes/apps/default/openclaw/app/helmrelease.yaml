---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app openclaw
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: openclaw
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      openclaw:
        strategy: Recreate
        annotations:
          secret.reloader.stakater.com/reload: openclaw-secret
        pod:
          automountServiceAccountToken: false
          terminationGracePeriodSeconds: 120
        initContainers:
          init-config:
            image:
              repository: docker.io/library/busybox
              tag: "1.38"
            command:
              - sh
              - -c
              - |
                set -eu
                mkdir -p /pvc/data/.openclaw/workspace
                chmod 0700 /pvc/data
                find /pvc/data -type d -user 1000 -perm -2000 -exec chmod g-s {} +
                [ -f /pvc/data/.openclaw/openclaw.json ] || cp /seed/openclaw.json /pvc/data/.openclaw/openclaw.json
                [ -f /pvc/data/.openclaw/workspace/AGENTS.md ] || cp /seed/AGENTS.md /pvc/data/.openclaw/workspace/AGENTS.md
                mkdir -p /tmp-volume/gateway-tmp && chmod 1777 /tmp-volume/gateway-tmp
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
        containers:
          app:
            image:
              repository: ghcr.io/openclaw/openclaw
              tag: 2026.11.6-slim@sha256:65e229536a2698f0ab211c8a3d1c5c8e2685d19379d153e95f93ff76f22779cf
            command: ["node", "/app/dist/index.js", "gateway", "run"]
            env:
              TZ: America/Los_Angeles
              HOME: /home/node
              OPENCLAW_CONFIG_DIR: /home/node/.openclaw
              OPENCLAW_STATE_DIR: /home/node/.openclaw
              XDG_CACHE_HOME: /home/node/.openclaw/.cache
              NODE_ENV: production
            envFrom:
              - secretRef:
                  name: openclaw-secret
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: &startupz
                      - node
                      - -e
                      - "require('http').get('http://127.0.0.1:18789/startupz', r => { let b = ''; r.on('data', d => b += d); r.on('end', () => { try { process.exit(r.statusCode < 400 && JSON.parse(b).ok === true ? 0 : 1); } catch { process.exit(1); } }); }).on('error', () => process.exit(1))"
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: *startupz
                  periodSeconds: 10
                  timeoutSeconds: 5
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - node
                      - -e
                      - "require('http').get('http://127.0.0.1:18789/healthz', r => { let b = ''; r.on('data', d => b += d); r.on('end', () => { try { process.exit(r.statusCode < 400 && JSON.parse(b).ok === true ? 0 : 1); } catch { process.exit(1); } }); }).on('error', () => process.exit(1))"
                  periodSeconds: 30
                  timeoutSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 250m
                memory: 2Gi
              limits:
                memory: 4Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: openclaw
        ports:
          http:
            port: 18789
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            path: /healthz
        hostnames:
          - "{{ .Release.Name }}.ok8.sh"
        parentRefs:
          - name: internal
            namespace: networking
    persistence:
      home:
        existingClaim: openclaw-zfs
        advancedMounts:
          openclaw:
            init-config:
              - path: /pvc
            app:
              - path: /home/node
                subPath: data
      config:
        type: configMap
        name: openclaw-config
        advancedMounts:
          openclaw:
            init-config:
              - path: /seed
                readOnly: true
      tmp:
        type: emptyDir
        advancedMounts:
          openclaw:
            init-config:
              - path: /tmp-volume
            app:
              - path: /tmp
                subPath: gateway-tmp
