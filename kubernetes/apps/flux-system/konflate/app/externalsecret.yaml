---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: konflate-webhook-token
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: konflate-webhook-token-secret
    template:
      data:
        KONFLATE_WEBHOOK_SECRET: "{{ .konflate_KONFLATE_WEBHOOK_SECRET }}"
        KONFLATE_APP_CLIENT_ID: "{{ .waifuz_bot_APP_ID }}"
        KONFLATE_APP_PRIVATE_KEY: "{{ .waifuz_bot_PRIVATE_KEY }}"
  dataFrom:
    - extract:
        key: konflate
      rewrite:
        - regexp:
            source: "(.*)"
            target: "konflate_$1"
    - extract:
        key: waifuz-bot
      rewrite:
        - regexp:
            source: "(.*)"
            target: "waifuz_bot_$1"
