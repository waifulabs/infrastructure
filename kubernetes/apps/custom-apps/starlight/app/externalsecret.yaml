---
# yaml-language-server: $schema=https://kubernetes-schemas.ok8.sh/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: starlight
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: starlight-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Also signs deletion URLs; rotating it invalidates existing ones.
        UPLOAD_TOKEN: "{{ .UPLOAD_TOKEN }}"
  dataFrom:
    - extract:
        key: starlight
