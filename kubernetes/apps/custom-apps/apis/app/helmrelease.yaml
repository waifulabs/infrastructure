---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app apis
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      apis:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/kashalls/apis
              tag: 0.0.2@sha256:cd7367fbcaa2a0eb12cedc1366d0c72d03282a037f345ae51f0e1f463cbb0dc5
            env:
              TZ: America/Los_Angeles
              PUBLIC_BASE_URL: "https://api.ok8.sh"
              TRUSTED_PROXY_CIDRS: "10.0.20.0/24,172.30.0.0/16"
              WOW_CHARACTERS: "retail/area-52/Nyãna"
              OVERWATCH_BATTLETAGS: "Kashall#11253"
            envFrom:
              - secretRef:
                  name: apis-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: false
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 192Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: apis
        ports:
          http:
            port: &port 8080
    route:
      app:
        annotations:
          gatus.home-operations.com/enabled: "false"
        hostnames: ["api.ok8.sh"]
        parentRefs:
          - name: external
            namespace: networking
            sectionName: https
        rules:
          - matches:
              - path: { type: PathPrefix, value: /trmnl }
            filters:
              - type: URLRewrite
                urlRewrite:
                  path: { type: ReplacePrefixMatch, replacePrefixMatch: /api/trmnl }
            backendRefs: &backend
              - name: *app
                port: *port
          - matches:
              - path: { type: PathPrefix, value: /homeassistant }
            filters:
              - type: URLRewrite
                urlRewrite:
                  path: { type: ReplacePrefixMatch, replacePrefixMatch: /api/homeassistant }
            backendRefs: *backend
          - matches:
              - path: { type: PathPrefix, value: /spotify }
            filters:
              - type: URLRewrite
                urlRewrite:
                  path: { type: ReplacePrefixMatch, replacePrefixMatch: /api/spotify }
            backendRefs: *backend
          - matches:
              - path: { type: PathPrefix, value: /github }
            filters:
              - type: URLRewrite
                urlRewrite:
                  path: { type: ReplacePrefixMatch, replacePrefixMatch: /api/github }
            backendRefs: *backend
          - matches:
              - path: { type: PathPrefix, value: /wow }
            filters:
              - type: URLRewrite
                urlRewrite:
                  path: { type: ReplacePrefixMatch, replacePrefixMatch: /api/wow }
            backendRefs: *backend
          - matches:
              - path: { type: PathPrefix, value: /overwatch }
            filters:
              - type: URLRewrite
                urlRewrite:
                  path: { type: ReplacePrefixMatch, replacePrefixMatch: /api/overwatch }
            backendRefs: *backend
    persistence:
      data:
        existingClaim: apis-zfs
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
