---
# yaml-language-server: $schema=https://kubernetes-schemas.ok8.sh/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: snmp-exporter
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: snmp-exporter-auth
    template:
      engineVersion: v2
      data:
        auths.yaml: |
          auths:
            rackups_v3:
              username: "{{ .username }}"
              security_level: authPriv
              password: "{{ .password }}"
              auth_protocol: SHA
              priv_protocol: AES
              priv_password: "{{ .password }}"
              version: 3
  dataFrom:
    - extract:
        key: readuser
