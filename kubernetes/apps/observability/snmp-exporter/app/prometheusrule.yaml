---
# yaml-language-server: $schema=https://kubernetes-schemas.ok8.sh/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: snmp-exporter-rules
spec:
  groups:
    - name: snmp-exporter.rules
      rules:
        - alert: UPSOnBattery
          expr: upsOutputSource{upsOutputSource="battery"} == 1
          annotations:
            summary: >-
              UPS {{$labels.instance}} is running on battery
          for: 1m
          labels:
            severity: critical
        - alert: UPSLowRuntime
          expr: |-
            upsEstimatedMinutesRemaining <= 20 and on(instance) upsOutputSource{upsOutputSource="battery"} == 1
          annotations:
            summary: >-
              UPS {{$labels.instance}} has {{$value}} minutes of battery left
          labels:
            severity: critical
        - alert: UPSAlarm
          expr: |-
            upsAlarmsPresent > 0 unless on(instance) upsOutputSource{upsOutputSource="battery"} == 1
          annotations:
            summary: >-
              UPS {{$labels.instance}} has {{$value}} active alarm(s)
          for: 5m
          labels:
            severity: warning
