---
# yaml-language-server: $schema=https://kubernetes-schemas.ok8.sh/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: alertmanager-secret
    template:
      engineVersion: v2
      data:
        ALERTMANAGER_HEARTBEAT_URL: "{{ .alertmanager_ALERTMANAGER_HEARTBEAT_URL }}"
        ALERTMANAGER_PUSHOVER_TOKEN: "{{ .alertmanager_ALERTMANAGER_PUSHOVER_TOKEN }}"
        PUSHOVER_USER_KEY: "{{ .pushover_PUSHOVER_USER_KEY }}"
  dataFrom:
    - extract:
        key: pushover
      rewrite:
        - regexp:
            source: "(.*)"
            target: "pushover_$1"
    - extract:
        key: alertmanager
      rewrite:
        - regexp:
            source: "(.*)"
            target: "alertmanager_$1"
