---
# yaml-language-server: $schema=https://kubernetes-schemas.ok8.sh/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qui
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: qui-secret
    template:
      data:
        QUI__SESSION_SECRET: "{{ .qui_QUI_SESSION_SECRET }}"
  dataFrom:
    - extract:
        key: qui
      rewrite:
        - regexp:
            source: "(.*)"
            target: "qui_$1"
