---
# yaml-language-server: $schema=https://kubernetes-schemas.ok8.sh/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: waifulabs-runner
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: waifulabs-runner-secret
    template:
      data:
        # github_token: "{{ .waifuz_bot_RUNNER_TOKEN }}"
        github_app_id: "{{ .waifuz_bot_APP_ID }}"
        github_app_installation_id: "{{ .waifuz_bot_INSTALLATION_ID }}"
        github_app_private_key: "{{ .waifuz_bot_PRIVATE_KEY }}"
  dataFrom:
    - extract:
        key: waifuz-bot
      rewrite:
        - regexp:
            source: "(.*)"
            target: "waifuz_bot_$1"
